<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: common_head('Manual Booklets')}"></th:block>
    <th:block th:replace="~{fragments :: datatables-css}"></th:block>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: bottom_nav}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manual Invoice Booklets</h2>
        <a href="/estimates/manual/new" class="btn btn-primary fw-bold shadow-sm"><i class="bi bi-file-earmark-plus"></i> Generate New Booklet</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible bg-success text-white fade show border-0 shadow-sm" role="alert">
        <strong th:text="${successMessage}">Success</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0 p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle datatable">
                <thead class="table-light">
                    <tr>
                        <th>Booklet ID</th>
                        <th>Date Generated</th>
                        <th>Vendor (Buyer)</th>
                        <th>Pages (Invoices)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booklet : ${booklets}">
                        <td data-label="Booklet ID" class="fw-bold text-primary" th:text="${booklet.bookletId}"></td>
                        <td data-label="Date Generated" th:text="${#temporals.format(booklet.date, 'dd-MMM-yyyy')}"></td>
                        <td data-label="Vendor" th:text="${booklet.buyerName}"></td>
                        <td data-label="Pages" th:text="${booklet.pageCount}"></td>
                        <td data-label="Actions">
                            <a th:href="@{/estimates/manual/booklets/{id}/pdf(id=${booklet.bookletId})}" class="btn btn-sm btn-outline-secondary shadow-sm">
                                <i class="bi bi-file-pdf"></i> Download Booklet
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments :: datatables-js}"></th:block>
<script>
    $(document).ready(function() {
        $('.datatable').DataTable({
            "order": [ [1, "desc"] ],
            "language": {
                "search": "_INPUT_",
                "searchPlaceholder": "Search Booklets..."
            }
        });
    });
</script>
</body>
</html>
